name: wifi_restart_procfs
shell_script: scripts/test_wifi_restart_procfs.sh
default_case: all
cases:
  1:
    id: interface-bringup
    title: "Create procfs entries after interface bring-up"
    description: "Bring up the first Wi-Fi interface and inspect its procfs directory, RRM file, and channels.json."
    expected: "The interface procfs directory and required files exist and are readable."
  2:
    id: interface-restart
    title: "Restart one interface without affecting others"
    description: "Bring the first Wi-Fi interface down and up while checking that the second interface RRM file remains available."
    expected: "The restarted interface procfs entries are removed and recreated while other interfaces remain operational."
  3:
    id: multi-interface-stability
    title: "Maintain stability across multiple interfaces"
    description: "Bring up all ra* interfaces, restart one interface, and verify that another interface remains unaffected."
    expected: "The procfs entry count matches the interface count and restarting one interface does not affect the others."
  4:
    id: rapid-restart-stress
    title: "Complete five rapid restart cycles"
    description: "Perform five consecutive down/up cycles on the first Wi-Fi interface."
    expected: "RRM SelfNeighborReportElement remains available after every cycle."
  5:
    id: all-interface-restart
    title: "Restart all Wi-Fi interfaces"
    description: "Bring down all Wi-Fi interfaces, start the main interfaces, wait for firmware initialization, and restore virtual interfaces."
    expected: "All procfs interface entries are removed and then fully restored."
  6:
    id: wifi-reload
    title: "Restore procfs after wifi reload"
    description: "Run wifi reload, wait for Wi-Fi initialization, and check interfaces, channels.json, and RRM."
    expected: "The interface count does not decrease and all required procfs files exist after reload."
  7:
    id: wifi-restart
    title: "Restore procfs after wifi restart"
    description: "Run wifi restart and verify interface recovery, channels.json, and repeated read stability."
    expected: "Interfaces and required procfs files are fully restored and remain readable after restart."
